<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="offGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <linearGradient id="onGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="960" height="420" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="42" fill="#F8FAFC" font-size="20" font-weight="700">Worker Subagent Quota Drain: Inherit vs Flash</text>
  <text x="32" y="64" fill="#94A3B8" font-size="12.5">Gemini AI Pro • Identical 4-bug Python fix + 5 unit tests (all runs 5/5 pass) • Lower is better</text>

  <!-- Global Legend -->
  <rect x="652" y="26" width="12" height="12" rx="3" fill="url(#offGrad)"/>
  <text x="670" y="36" fill="#E2E8F0" font-size="12" font-weight="600">Inherit (parent)</text>
  <rect x="782" y="26" width="12" height="12" rx="3" fill="url(#onGrad)"/>
  <text x="800" y="36" fill="#E2E8F0" font-size="12" font-weight="600">Flash (Hydrogen High)</text>

  <!-- Panel 1: Claude Pool (5-Hour Limit) -->
  <rect x="32" y="86" width="516" height="296" rx="12" fill="#1E293B" fill-opacity="0.55" stroke="#334155" stroke-width="1"/>
  <text x="52" y="114" fill="#F8FAFC" font-size="15" font-weight="700">1. Claude Pool — 5-Hour Limit Drain</text>
  <text x="52" y="132" fill="#94A3B8" font-size="11.5">Scale: 0% to 12.0% Claude 5-Hr drain • Includes parent dispatch turn</text>

  <!-- Gridlines Panel 1 (x=150 is 0%, 20px per 1.00%) -->
  <line x1="150" y1="150" x2="150" y2="338" stroke="#475569" stroke-width="1"/>
  <line x1="250" y1="150" x2="250" y2="338" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="350" y1="150" x2="350" y2="338" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="390" y1="150" x2="390" y2="338" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>

  <text x="150" y="354" fill="#64748B" font-size="10.5" text-anchor="middle">0%</text>
  <text x="250" y="354" fill="#64748B" font-size="10.5" text-anchor="middle">5%</text>
  <text x="350" y="354" fill="#64748B" font-size="10.5" text-anchor="middle">10%</text>
  <text x="390" y="354" fill="#64748B" font-size="10.5" text-anchor="middle">12%</text>

  <!-- Claude Sonnet 5.5 (Low) -->
  <text x="52" y="170" fill="#F8FAFC" font-size="13" font-weight="700">Claude Sonnet 5.5 (Low)</text>
  <text x="328" y="170" fill="#94A3B8" font-size="11">Weekly: -2.79% → -1.64% (1.70x)</text>

  <text x="142" y="196" fill="#FCA5A5" font-size="11.5" font-weight="600" text-anchor="end">Inherit</text>
  <rect x="150" y="184" width="112" height="16" rx="4" fill="url(#offGrad)"/>
  <text x="270" y="196" fill="#FECACA" font-size="12" font-weight="700">-5.58%</text>

  <text x="142" y="220" fill="#6EE7B7" font-size="11.5" font-weight="600" text-anchor="end">Flash</text>
  <rect x="150" y="208" width="66" height="16" rx="4" fill="url(#onGrad)"/>
  <text x="224" y="220" fill="#34D399" font-size="12" font-weight="700">-3.28% (1.70x lower)</text>

  <!-- Divider -->
  <line x1="52" y1="242" x2="528" y2="242" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/>

  <!-- Claude Opus 5.5 (Low) -->
  <text x="52" y="266" fill="#F8FAFC" font-size="13" font-weight="700">Claude Opus 5.5 (Low)</text>
  <text x="328" y="266" fill="#94A3B8" font-size="11">Weekly: -5.89% → -3.29% (1.79x)</text>

  <text x="142" y="292" fill="#FCA5A5" font-size="11.5" font-weight="600" text-anchor="end">Inherit</text>
  <rect x="150" y="280" width="235" height="16" rx="4" fill="url(#offGrad)"/>
  <text x="393" y="292" fill="#FECACA" font-size="12" font-weight="700">-11.77%</text>

  <text x="142" y="316" fill="#6EE7B7" font-size="11.5" font-weight="600" text-anchor="end">Flash</text>
  <rect x="150" y="304" width="132" height="16" rx="4" fill="url(#onGrad)"/>
  <text x="290" y="316" fill="#34D399" font-size="12" font-weight="700">-6.59% (1.79x lower)</text>

  <text x="52" y="372" fill="#94A3B8" font-size="10.5">Offloaded worker cost on Gemini pool: -1.04%–1.05% 5-Hr (-0.26% Weekly)</text>

  <!-- Panel 2: Gemini Pool (5-Hour Limit) -->
  <rect x="568" y="86" width="360" height="296" rx="12" fill="#1E293B" fill-opacity="0.55" stroke="#334155" stroke-width="1"/>
  <text x="588" y="114" fill="#F8FAFC" font-size="15" font-weight="700">2. Gemini Pool — 5-Hour Drain</text>
  <text x="588" y="132" fill="#94A3B8" font-size="11.5">Scale: 0% to 3.5% Gemini 5-Hr drain • 58s vs 72–97s</text>

  <!-- Gridlines Panel 2 (x=650 is 0%, 50px per 1.00%) -->
  <line x1="650" y1="150" x2="650" y2="338" stroke="#475569" stroke-width="1"/>
  <line x1="700" y1="150" x2="700" y2="338" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="750" y1="150" x2="750" y2="338" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="800" y1="150" x2="800" y2="338" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>

  <text x="650" y="354" fill="#64748B" font-size="10.5" text-anchor="middle">0%</text>
  <text x="700" y="354" fill="#64748B" font-size="10.5" text-anchor="middle">1%</text>
  <text x="750" y="354" fill="#64748B" font-size="10.5" text-anchor="middle">2%</text>
  <text x="800" y="354" fill="#64748B" font-size="10.5" text-anchor="middle">3%</text>

  <!-- Neon Medium vs Hydrogen High -->
  <text x="588" y="170" fill="#F8FAFC" font-size="13" font-weight="700">Neon (Med) vs Hydrogen (High)</text>

  <text x="642" y="196" fill="#FCA5A5" font-size="11" font-weight="600" text-anchor="end">Neon M</text>
  <rect x="650" y="184" width="104" height="16" rx="4" fill="url(#offGrad)"/>
  <text x="762" y="196" fill="#FECACA" font-size="11.5" font-weight="700">-2.07% (72s)</text>

  <text x="642" y="220" fill="#6EE7B7" font-size="11" font-weight="600" text-anchor="end">Flash</text>
  <rect x="650" y="208" width="72" height="16" rx="4" fill="url(#onGrad)"/>
  <text x="730" y="220" fill="#34D399" font-size="11.5" font-weight="700">-1.43% (-31%, 58s)</text>

  <!-- Divider -->
  <line x1="588" y1="242" x2="908" y2="242" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/>

  <!-- Neon High vs Hydrogen High -->
  <text x="588" y="266" fill="#F8FAFC" font-size="13" font-weight="700">Neon (High) vs Hydrogen (High)</text>

  <text x="642" y="292" fill="#FCA5A5" font-size="11" font-weight="600" text-anchor="end">Neon H</text>
  <rect x="650" y="280" width="121" height="16" rx="4" fill="url(#offGrad)"/>
  <text x="779" y="292" fill="#FECACA" font-size="11.5" font-weight="700">-2.42% (97s)</text>

  <text x="642" y="316" fill="#6EE7B7" font-size="11" font-weight="600" text-anchor="end">Flash</text>
  <rect x="650" y="304" width="72" height="16" rx="4" fill="url(#onGrad)"/>
  <text x="730" y="316" fill="#34D399" font-size="11.5" font-weight="700">-1.43% (1.7x, 58s)</text>

  <text x="588" y="372" fill="#94A3B8" font-size="10.5">Hydrogen token price is 2x lower ($1.50/$7.50 vs $3/$15)</text>

  <!-- Footer -->
  <text x="32" y="404" fill="#64748B" font-size="11">Scope: Delegated worker subagent pinned to model: flash (gemini-4-hydrogen-tiered-high). Neon High settled range: -1.63% to -3.29% 5-Hr.</text>
</svg>
