<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="offGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <linearGradient id="onGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="960" height="420" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="42" fill="#F8FAFC" font-size="20" font-weight="700">Research Subagent Quota Drain: Plugin OFF vs ON</text>
  <text x="32" y="64" fill="#94A3B8" font-size="12.5">Gemini AI Pro • Fresh isolated agy -p single-dispatch runs (6-doc synthesis) • Lower is better</text>

  <!-- Global Legend -->
  <rect x="652" y="26" width="12" height="12" rx="3" fill="url(#offGrad)"/>
  <text x="670" y="36" fill="#E2E8F0" font-size="12" font-weight="600">Plugin OFF (inherit)</text>
  <rect x="802" y="26" width="12" height="12" rx="3" fill="url(#onGrad)"/>
  <text x="820" y="36" fill="#E2E8F0" font-size="12" font-weight="600">Plugin ON (flash_lite)</text>

  <!-- Panel 1: General Pool (5-Hour Limit) -->
  <rect x="32" y="86" width="516" height="296" rx="12" fill="#1E293B" fill-opacity="0.55" stroke="#334155" stroke-width="1"/>
  <text x="52" y="114" fill="#F8FAFC" font-size="15" font-weight="700">1. General Pool — 5-Hour Limit Drain</text>
  <text x="52" y="132" fill="#94A3B8" font-size="11.5">Same scale (0% to 1.40% 5-Hr drain) • Includes parent dispatch turn</text>

  <!-- Gridlines Panel 1 (x=150 is 0%, 200px per 1.00%) -->
  <line x1="150" y1="150" x2="150" y2="338" stroke="#475569" stroke-width="1"/>
  <line x1="250" y1="150" x2="250" y2="338" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="350" y1="150" x2="350" y2="338" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="430" y1="150" x2="430" y2="338" stroke="#334155" stroke-dasharray="3 3" stroke-width="1"/>

  <text x="150" y="354" fill="#64748B" font-size="10.5" text-anchor="middle">0.0%</text>
  <text x="250" y="354" fill="#64748B" font-size="10.5" text-anchor="middle">0.5%</text>
  <text x="350" y="354" fill="#64748B" font-size="10.5" text-anchor="middle">1.0%</text>
  <text x="430" y="354" fill="#64748B" font-size="10.5" text-anchor="middle">1.4%</text>

  <!-- Hydrogen High -->
  <text x="52" y="170" fill="#F8FAFC" font-size="13" font-weight="700">Gemini 4 Hydrogen (High)</text>
  <text x="328" y="170" fill="#94A3B8" font-size="11">Weekly: -0.11% → -0.05% (2.20x)</text>

  <text x="142" y="196" fill="#FCA5A5" font-size="11.5" font-weight="600" text-anchor="end">OFF</text>
  <rect x="150" y="184" width="80" height="16" rx="4" fill="url(#offGrad)"/>
  <text x="238" y="196" fill="#FECACA" font-size="12" font-weight="700">-0.40%</text>

  <text x="142" y="220" fill="#6EE7B7" font-size="11.5" font-weight="600" text-anchor="end">ON</text>
  <rect x="150" y="208" width="30" height="16" rx="4" fill="url(#onGrad)"/>
  <text x="188" y="220" fill="#34D399" font-size="12" font-weight="700">-0.15% (2.67x lower)</text>

  <!-- Divider -->
  <line x1="52" y1="242" x2="528" y2="242" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/>

  <!-- Neon High -->
  <text x="52" y="266" fill="#F8FAFC" font-size="13" font-weight="700">Gemini 4 Neon (High)</text>
  <text x="328" y="266" fill="#94A3B8" font-size="11">Weekly: -0.38% → -0.09% (4.22x)</text>

  <text x="142" y="292" fill="#FCA5A5" font-size="11.5" font-weight="600" text-anchor="end">OFF</text>
  <rect x="150" y="280" width="264" height="16" rx="4" fill="url(#offGrad)"/>
  <text x="422" y="292" fill="#FECACA" font-size="12" font-weight="700">-1.32%</text>

  <text x="142" y="316" fill="#6EE7B7" font-size="11.5" font-weight="600" text-anchor="end">ON</text>
  <rect x="150" y="304" width="62" height="16" rx="4" fill="url(#onGrad)"/>
  <text x="220" y="316" fill="#34D399" font-size="12" font-weight="700">-0.31% (4.26x lower)</text>

  <text x="52" y="372" fill="#94A3B8" font-size="10.5">Isolated flash_lite research subagent drain: &lt;0.01% (0.00% measured)</text>

  <!-- Panel 2: Dedicated Pool (Claude) -->
  <rect x="568" y="86" width="360" height="296" rx="12" fill="#1E293B" fill-opacity="0.55" stroke="#334155" stroke-width="1"/>
  <text x="588" y="114" fill="#F8FAFC" font-size="15" font-weight="700">2. Dedicated Pool — Claude</text>
  <text x="588" y="132" fill="#94A3B8" font-size="11.5">Separate weekly/session pool (not comparable to Panel 1 scale)</text>

  <!-- Isolated Subagent Drain Callout -->
  <rect x="588" y="150" width="320" height="150" rx="8" fill="#0F172A" stroke="#065F46" stroke-width="1"/>
  <text x="602" y="172" fill="#34D399" font-size="12" font-weight="700">Isolated research subagent drain (Plugin ON)</text>
  <text x="602" y="193" fill="#E2E8F0" font-size="11.5">• Claude Opus 5.5 (Med): 0.00% Claude</text>
  <text x="616" y="211" fill="#E2E8F0" font-size="11.5">• &lt;0.01% General</text>
  <text x="602" y="233" fill="#94A3B8" font-size="10.5">(Opus parent turns: -3.70% Weekly / -7.39% 5-Hr)</text>
  <text x="602" y="251" fill="#94A3B8" font-size="10.5">Plugin OFF skipped to preserve quota —</text>
  <text x="602" y="266" fill="#94A3B8" font-size="10.5">0.00% further Claude movement from research.</text>
  <text x="602" y="284" fill="#94A3B8" font-size="10.5">Combined dispatch: 0.00% General movement.</text>

  <!-- Footer -->
  <text x="32" y="404" fill="#64748B" font-size="11">Scope: Chart shows delegated research calls (model: flash_lite). Parent turns use your selected model; worker subagent runs on model: flash.</text>
</svg>
