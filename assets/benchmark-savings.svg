<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="580" rx="16" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <text x="36" y="42" fill="#F8FAFC" font-size="20" font-weight="700">Antigravity Research Subagent Savings: Flash-Lite Hook vs Frontier Models</text>
  <text x="36" y="66" fill="#94A3B8" font-size="13">Gemini AI Pro • Fresh agy -p single-dispatch runs • Savings apply strictly to research subagent calls</text>

  <!-- Left Card: Side-by-Side Hydrogen & Neon (Plugin OFF vs ON) -->
  <rect x="32" y="88" width="555" height="270" rx="12" fill="#1E293B" fill-opacity="0.55" stroke="#334155" stroke-width="1"/>
  <text x="52" y="116" fill="#E2E8F0" font-size="15" font-weight="700">1. General Pool Drain: Plugin OFF vs ON (Hydrogen &amp; Neon)</text>
  <text x="52" y="135" fill="#94A3B8" font-size="12">Fresh agy -p 6-doc research dispatch • 5-Hour &amp; Weekly drain (lower is better)</text>

  <!-- Group 1: Hydrogen High -->
  <text x="52" y="164" fill="#F8FAFC" font-size="13" font-weight="700">Gemini 4 Hydrogen (High)</text>

  <text x="64" y="185" fill="#FBBF24" font-size="12" font-weight="600">Plugin OFF (inherit)</text>
  <rect x="245" y="175" width="54" height="11" rx="3" fill="url(#amberGrad)"/>
  <text x="307" y="185" fill="#FDE68A" font-size="12" font-weight="700">-0.40% 5-Hr</text>
  <rect x="245" y="189" width="15" height="8" rx="3" fill="#D97706"/>
  <text x="268" y="196" fill="#FEF3C7" font-size="11">-0.11% Weekly</text>

  <text x="64" y="217" fill="#34D399" font-size="12" font-weight="600">Plugin ON (flash_lite)</text>
  <rect x="245" y="207" width="20" height="11" rx="3" fill="url(#greenGrad)"/>
  <text x="273" y="217" fill="#34D399" font-size="12" font-weight="700">-0.15% 5-Hr (2.67x lower)</text>
  <rect x="245" y="221" width="7" height="8" rx="3" fill="#059669"/>
  <text x="260" y="228" fill="#A7F3D0" font-size="11">-0.05% Weekly (2.20x lower)</text>

  <!-- Divider -->
  <line x1="52" y1="241" x2="567" y2="241" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Group 2: Neon High -->
  <text x="52" y="262" fill="#F8FAFC" font-size="13" font-weight="700">Gemini 4 Neon (High)</text>

  <text x="64" y="283" fill="#F87171" font-size="12" font-weight="600">Plugin OFF (inherit)</text>
  <rect x="245" y="273" width="178" height="11" rx="3" fill="url(#redGrad)"/>
  <text x="431" y="283" fill="#FCA5A5" font-size="12" font-weight="700">-1.32% 5-Hr</text>
  <rect x="245" y="287" width="51" height="8" rx="3" fill="#DC2626"/>
  <text x="304" y="294" fill="#FECACA" font-size="11">-0.38% Weekly</text>

  <text x="64" y="315" fill="#34D399" font-size="12" font-weight="600">Plugin ON (flash_lite)</text>
  <rect x="245" y="305" width="42" height="11" rx="3" fill="url(#greenGrad)"/>
  <text x="295" y="315" fill="#34D399" font-size="12" font-weight="700">-0.31% 5-Hr (4.26x lower)</text>
  <rect x="245" y="319" width="12" height="8" rx="3" fill="#059669"/>
  <text x="265" y="326" fill="#A7F3D0" font-size="11">-0.09% Weekly (4.22x lower)</text>

  <text x="52" y="347" fill="#94A3B8" font-size="11">Note: Above ON numbers include the parent frontier dispatch turn; isolated flash_lite subagent drain is &lt;0.01%.</text>

  <!-- Right Card: Argon & Claude Separate Pools -->
  <rect x="605" y="88" width="323" height="270" rx="12" fill="#1E293B" fill-opacity="0.55" stroke="#334155" stroke-width="1"/>
  <text x="625" y="116" fill="#E2E8F0" font-size="15" font-weight="700">2. Separate Pools: Argon &amp; Claude</text>
  <text x="625" y="135" fill="#94A3B8" font-size="12">Dedicated Argon Weekly &amp; Claude limits</text>

  <text x="625" y="164" fill="#CBD5E1" font-size="12" font-weight="600">Gemini 4 Argon (High) — Argon Weekly:</text>

  <text x="625" y="186" fill="#A78BFA" font-size="12" font-weight="700">Plugin OFF (inherit)</text>
  <rect x="625" y="193" width="175" height="14" rx="3" fill="url(#purpleGrad)"/>
  <text x="808" y="204" fill="#DDD6FE" font-size="12" font-weight="700">-1.24% Argon</text>

  <text x="625" y="227" fill="#34D399" font-size="12" font-weight="700">Plugin ON (flash_lite subagent)</text>
  <rect x="625" y="234" width="54" height="14" rx="3" fill="url(#greenGrad)"/>
  <text x="687" y="245" fill="#34D399" font-size="12" font-weight="700">-0.38% (3.26x lower)</text>

  <rect x="625" y="264" width="283" height="78" rx="8" fill="#0F172A" stroke="#065F46" stroke-width="1"/>
  <text x="637" y="284" fill="#34D399" font-size="12" font-weight="700">Isolated research subagent drain:</text>
  <text x="637" y="303" fill="#E2E8F0" font-size="11">• Argon ON: 0.00% Argon, 0.00% (&lt;0.01%) General</text>
  <text x="637" y="321" fill="#E2E8F0" font-size="11">• Opus 5.5 ON: 0.00% Claude, 0.00% (&lt;0.01%) General</text>
  <text x="637" y="336" fill="#94A3B8" font-size="10">(Opus parent turns: -3.70% Weekly / -7.39% 5-Hr)</text>

  <!-- Bottom Card: Estimated Overall Session Gains (research-Only Savings Scaled by Workflow) -->
  <rect x="32" y="374" width="896" height="180" rx="12" fill="#1E293B" fill-opacity="0.55" stroke="#334155" stroke-width="1"/>
  <text x="52" y="401" fill="#E2E8F0" font-size="15" font-weight="700">3. Estimated Total Session Gains (Measured Savings Apply to research Subagent ONLY)</text>
  <text x="52" y="419" fill="#94A3B8" font-size="12">Scaled from FastContext (46.5% exploration token share) by how much discovery is delegated to research</text>

  <!-- Card 1: Small Repos / Targeted Edits -->
  <rect x="52" y="432" width="274" height="106" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="66" y="453" fill="#F8FAFC" font-size="13" font-weight="700">Small Repos / Targeted Edits</text>
  <text x="66" y="469" fill="#94A3B8" font-size="11">~10% delegated to research</text>
  <rect x="66" y="479" width="246" height="8" rx="4" fill="#1E293B"/>
  <rect x="66" y="479" width="52" height="8" rx="4" fill="url(#blueGrad)"/>
  <text x="66" y="505" fill="#60A5FA" font-size="13" font-weight="700">~22% Hydrogen • ~32% Argon</text>
  <text x="66" y="523" fill="#93C5FD" font-size="13" font-weight="700">~44% Neon <tspan fill="#94A3B8" font-size="11" font-weight="400">total session gain</tspan></text>

  <!-- Card 2: Unfamiliar Repos / Exploration-Heavy -->
  <rect x="343" y="432" width="274" height="106" rx="8" fill="#0F172A" stroke="#065F46"/>
  <text x="357" y="453" fill="#F8FAFC" font-size="13" font-weight="700">Unfamiliar / Exploration-Heavy</text>
  <text x="357" y="469" fill="#94A3B8" font-size="11">~50% delegated to research</text>
  <rect x="357" y="479" width="246" height="8" rx="4" fill="#1E293B"/>
  <rect x="357" y="479" width="142" height="8" rx="4" fill="url(#greenGrad)"/>
  <text x="357" y="505" fill="#34D399" font-size="13" font-weight="700">Up to ~1.1x Hydrogen • ~1.63x Argon</text>
  <text x="357" y="523" fill="#A7F3D0" font-size="13" font-weight="700">Up to ~2.1x Neon <tspan fill="#94A3B8" font-size="11" font-weight="400">+ cache savings</tspan></text>

  <!-- Card 3: High-Impact Workflows -->
  <rect x="634" y="432" width="274" height="106" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="648" y="453" fill="#F8FAFC" font-size="13" font-weight="700">High-Impact Workflows</text>
  <text x="648" y="472" fill="#CBD5E1" font-size="11">• QA, bug triage &amp; log/trace analysis</text>
  <text x="648" y="489" fill="#CBD5E1" font-size="11">• Code audits &amp; security reviews</text>
  <text x="648" y="506" fill="#CBD5E1" font-size="11">• PR validation &amp; impact analysis</text>
  <text x="648" y="523" fill="#CBD5E1" font-size="11">• Onboarding, refactors &amp; doc synthesis</text>
</svg>
